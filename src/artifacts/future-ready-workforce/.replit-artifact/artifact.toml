kind = "web"
previewPath = "/"
title = "Nexora"
description = "An AI-era career transition workspace for Malaysian workers, graduates, and HR teams. It connects a skills profile to updateable public job-market signals, explainable future-role matches, SDG-linked learning pathways, scenario estimates, and team readiness insights."
version = "1.0.0"
id = "artifacts/future-ready-workforce"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22019

[services.development]
run = "pnpm --filter @workspace/future-ready-workforce run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/future-ready-workforce", "run", "build" ]
serve = "static"
publicDir = "artifacts/future-ready-workforce/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22019"
BASE_PATH = "/"
